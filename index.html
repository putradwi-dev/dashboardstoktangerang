<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencatatan Stok Barang Realtime PT. MBP</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-body: #F6F3EC;               /* Warna latar belakang hangat */
      --primary-header: #8D7663;        /* Warna cokelat hangat header */
      --soft-card: #FFFFFF;             /* Kartu putih bersih */
      --text-main: #4A403A;             /* Teks utama gelap kecokelatan */
      --text-muted: #8C7B70;            /* Teks sekunder */
      
      /* Status Badge Colors (Warm Theme) */
      --badge-available-bg: #EAE3D9;
      --badge-available-text: #6B5B4F;
      --badge-empty-bg: #FCEAE8;
      --badge-empty-text: #ff0000;
      
      /* Row Colors */
      --row-empty-bg: #FFF5F5;
      --row-category-bg: #EFECE6;
      --row-category-text: #5A4D43;
    }

    body { 
      background-color: var(--bg-body); 
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      padding: 30px 15px; 
    }

    .main-banner {
      background-color: var(--primary-header);
      color: #FFFFFF;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(141, 118, 99, 0.15);
      margin-bottom: 24px;
    }

    .header-title {
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }

    .table-container { 
      background: var(--soft-card); 
      padding: 24px; 
      border-radius: 16px; 
      box-shadow: 0 10px 30px rgba(141, 118, 99, 0.05); 
      border: 1px solid #EAE3D9;
    }

    .search-input {
      border-radius: 10px;
      border: 1px solid #D9CBD0;
      padding: 10px 16px;
      background-color: #FAFAFA;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      background-color: #FFF;
      border-color: var(--primary-header);
      box-shadow: 0 0 0 4px rgba(141, 118, 99, 0.15);
    }

    .table {
      margin-bottom: 0;
      border-color: #EFECE6;
    }

    .table thead th {
      background-color: #EFECE6 !important;
      color: var(--primary-header) !important;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 14px 16px;
      border-bottom: 2px solid #EAE3D9;
    }

    .table tbody td {
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    /* Soft Badge Styles */
    .badge-soft-primary {
      background-color: var(--badge-available-bg) !important;
      color: var(--badge-available-text) !important;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
    }

    .badge-soft-danger {
      background-color: var(--badge-empty-bg) !important;
      color: var(--badge-empty-text) !important;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
    }

    .badge-gudang {
      background-color: #EFECE6;
      color: #6B5B4F;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
    }

    /* Style untuk barang dengan stok kosong/habis */
    .stok-habis { 
      background-color: var(--row-empty-bg) !important; 
      color: var(--badge-empty-text) !important; 
    }
    .stok-habis td {
      color: var(--badge-empty-text) !important;
    }

    /* Style khusus untuk baris judul/pemisah */
    .baris-judul-kategori {
      background-color: var(--row-category-bg) !important;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--row-category-text) !important;
      border-top: 2px solid #D9CBD0;
      border-bottom: 2px solid #D9CBD0;
    }
    
    /* Style Footer */
    .footer-text {
      text-align: center;
      margin-top: 30px;
      padding-bottom: 10px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .footer-text .developer {
      font-size: 0.80rem;
      font-weight: 500;
      opacity: 0.85;
      margin-top: 3px;
    }
  </style>
</head>
<body>

<div class="container-fluid max-width-lg">
  <!-- Banner Header dengan Tema Warna Hangat -->
  <div class="main-banner row align-items-center">
    <div class="col-md-6">
      <h2 class="header-title mb-1">📦 Stok Barang Realtime PT. MBP</h2>
      <p class="mb-0 text-white-50" style="font-size: 0.9rem;">Data Realtime dari Google Sheets</p>
    </div>
    <div class="col-md-6 text-md-end mt-3 mt-md-0">
      <input type="text" id="searchInput" class="form-control search-input" placeholder="🔍 Cari nama / gudang / merk / tipe..." onkeyup="filterBarang()">
    </div>
  </div>

  <div class="table-container table-responsive">
    <table class="table table-hover align-middle" id="stokTable">
      <thead>
        <tr>
          <th width="15">NO</th>
          <th width="240">BARANG</th>
          <th width="160">GUDANG / LOKASI</th>
          <th class="text-center" width="130">STOK AWAL</th>
          <th class="text-center" width="130">STOK KELUAR</th>
          <th class="text-center" width="170">SALDO / SISA STOK</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="6" class="text-center py-4 text-muted">Memuat data stok...</td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <!-- Footer -->
  <footer class="footer-text">
    <div>DASHBOARD STOK BARANG REALTIME PT. MBP © 2026</div>
    <div class="developer">by putradwi-dev</div>
  </footer>
</div>

<script>
  // GANTI URL DI BAWAH INI DENGAN URL APPS SCRIPT ANDA
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyubZMKxaNS89ROsbayuHtDugIWjAf2nGESShZWA5N8wUwMnZgrmKSwk-6-xDnEO2b9/exec';

  async function loadStokData() {
    try {
      const response = await fetch(SCRIPT_URL);
      const data = await response.json();
      
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      if (data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Tidak ada data stok.</td></tr>';
        return;
      }

      let currentGudang = 'GUDANG UTAMA'; // Default gudang pertama

      data.forEach(item => {
        const row = document.createElement('tr');
        
        // Deteksi apakah baris ini adalah Judul Kategori/Gudang
        const isJudulKategori = (!item.no || item.no === "") && 
                                (!item.stokAwal || item.stokAwal === "" || item.stokAwal === 0) && 
                                (!item.stokKeluar || item.stokKeluar === "" || item.stokKeluar === 0);

        if (isJudulKategori) {
          // Update gudang aktif saat ini
          if (item.barang && item.barang.trim() !== "") {
            currentGudang = item.barang.trim();
          }

          // Tampilan khusus untuk baris judul tabel / sub-judul gudang
          row.classList.add('baris-judul-kategori');
          row.innerHTML = `
            <td></td>
            <td colspan="5"><strong>📍 ${currentGudang}</strong></td>
          `;
        } else {
          // Tampilan untuk baris data barang biasa
          const saldoNum = Number(item.saldo);
          const isKosong = !isNaN(saldoNum) && saldoNum <= 0;
          
          let badgeClass = 'badge-soft-primary';
          
          if (isKosong) {
            row.classList.add('stok-habis');
            badgeClass = 'badge-soft-danger';
          }

          row.innerHTML = `
            <td>${item.no || ''}</td>
            <td><strong>${item.barang || ''}</strong></td>
            <td><span class="badge-gudang">${currentGudang}</span></td>
            <td class="text-center">${item.stokAwal !== "" && item.stokAwal !== undefined ? item.stokAwal : '-'}</td>
            <td class="text-center">${item.stokKeluar !== "" && item.stokKeluar !== undefined ? item.stokKeluar : '-'}</td>
            <td class="text-center">
              <span class="badge ${badgeClass} fs-6">${item.saldo !== undefined ? item.saldo : 0}</span>
            </td>
          `;
        }

        tableBody.appendChild(row);
      });
    } catch (error) {
      console.error('Gagal mengambil data:', error);
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Gagal memuat data dari Spreadsheet.</td></tr>';
    }
  }

  // Filter Pencarian
  function filterBarang() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    const rows = document.querySelectorAll('#tableBody tr');
    
    rows.forEach(row => {
      // Abaikan baris sub-judul kategori saat pemfilteran agar pencarian bersih
      if (row.classList.contains('baris-judul-kategori')) {
        row.style.display = input === '' ? '' : 'none';
        return;
      }

      const namaBarang = row.cells[1] ? row.cells[1].textContent.toLowerCase() : '';
      const namaGudang = row.cells[2] ? row.cells[2].textContent.toLowerCase() : '';

      if (namaBarang.includes(input) || namaGudang.includes(input)) {
        row.style.display = '';
      } else {
        row.style.display = 'none';
      }
    });
  }

  // Load pertama kali & set interval 10 detik
  loadStokData();
  setInterval(loadStokData, 10000);
</script>

</body>
</html>
