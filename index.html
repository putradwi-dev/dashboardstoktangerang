<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencatatan Stok Barang Realtime</title>
  <!-- Bootstrap 5 CSS untuk Tampilan Modern & Responsif HP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding: 20px; }
    .table-container { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .stok-habis { background-color: #ffe6e6 !important; color: #d9534f; font-weight: bold; }
  </style>
</head>
<body>

<div class="container-fluid max-width-lg">
  <div class="row mb-3 align-items-center">
    <div class="col-md-6">
      <h2>📦 Stok Barang Realtime</h2>
      <p class="text-muted mb-0">Terhubung langsung dengan Google Sheets</p>
    </div>
    <div class="col-md-6 text-md-end mt-2 mt-md-0">
      <input type="text" id="searchInput" class="form-control" placeholder="Cari nama barang..." onkeyup="filterBarang()">
    </div>
  </div>

  <div class="table-container table-responsive">
    <table class="table table-hover table-striped align-middle" id="stokTable">
      <thead class="table-dark">
        <tr>
          <th width="60">NO</th>
          <th>BARANG</th>
          <th class="text-center">STOK AWAL</th>
          <th class="text-center">STOK KELUAR</th>
          <th class="text-center">SALDO / SISA STOK</th>
          <th>KETERANGAN</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="6" class="text-center py-4">Memuat data stok...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // GANTI URL DI BAWAH INI DENGAN URL APPS SCRIPT ANDA
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyubZMKxaNS89ROsbayuHtDugIWjAf2nGESShZWA5N8wUwMnZgrmKSwk-6-xDnEO2b9/exec';

  async function loadStokData() {
    try {
      const response = await fetch(SCRIPT_URL);
      const data = await response.json();
      
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      if (data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="6" class="text-center">Tidak ada data stok.</td></tr>';
        return;
      }

      data.forEach(item => {
        const row = document.createElement('tr');
        
        // Memberi latar merah jika saldo 0
        if (parseInt(item.saldo) === 0) {
          row.classList.add('stok-habis');
        }

        row.innerHTML = `
          <td>${item.no || '-'}</td>
          <td><strong>${item.barang}</strong></td>
          <td class="text-center">${item.stokAwal}</td>
          <td class="text-center">${item.stokKeluar}</td>
          <td class="text-center"><span class="badge bg-primary fs-6">${item.saldo}</span></td>
          <td>${item.keterangan}</td>
        `;
        tableBody.appendChild(row);
      });
    } catch (error) {
      console.error('Gagal mengambil data:', error);
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Gagal memuat data dari Spreadsheet.</td></tr>';
    }
  }

  // Filter Pencarian
  function filterBarang() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    const rows = document.querySelectorAll('#tableBody tr');
    
    rows.forEach(row => {
      const namaBarang = row.cells[1] ? row.cells[1].textContent.toLowerCase() : '';
      if (namaBarang.includes(input)) {
        row.style.display = '';
      } else {
        row.style.display = 'none';
      }
    });
  }

  // Jalankan saat pertama kali dibuka
  loadStokData();

  // Refresh otomatis data tiap 10 detik
  setInterval(loadStokData, 10000);
</script>

</body>
</html>
