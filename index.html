<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencatatan Stok Barang Realtime PT. MBP</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-body: #f4f7f6;
      --primary-header: #34495e;
      --soft-card: #ffffff;
      --text-main: #2c3e50;
      --text-muted: #7f8c8d;
      
      /* Status Badge Colors (Soft) */
      --badge-available-bg: #e8f4fd;
      --badge-available-text: #2980b9;
      --badge-empty-bg: #fceae8;
      --badge-empty-text: #c0392b;
      
      /* Row Colors (Soft) */
      --row-empty-bg: #fff5f5;
      --row-category-bg: #ebf2f7;
      --row-category-text: #34495e;
    }

    body { 
      background-color: var(--bg-body); 
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      padding: 30px 15px; 
    }

    .header-title {
      font-weight: 700;
      color: var(--primary-header);
      letter-spacing: -0.5px;
    }

    .table-container { 
      background: var(--soft-card); 
      padding: 24px; 
      border-radius: 16px; 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03); 
      border: 1px solid #eef2f5;
    }

    .search-input {
      border-radius: 10px;
      border: 1px solid #dce4ec;
      padding: 10px 16px;
      background-color: #fafbfc;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      background-color: #fff;
      border-color: #a5b4fc;
      box-shadow: 0 0 0 4px rgba(165, 180, 252, 0.15);
    }

    .table {
      margin-bottom: 0;
      border-color: #f1f5f9;
    }

    .table thead th {
      background-color: #f8fafc !important;
      color: #64748b !important;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 14px 16px;
      border-bottom: 2px solid #e2e8f0;
    }

    .table tbody td {
      padding: 14px 16px;
      color: #334155;
      font-size: 0.95rem;
    }

    /* Soft Badge Styles */
    .badge-soft-primary {
      background-color: var(--badge-available-bg) !important;
      color: var(--badge-available-text) !important;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
    }

    .badge-soft-danger {
      background-color: var(--badge-empty-bg) !important;
      color: var(--badge-empty-text) !important;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
    }

    /* Style untuk barang dengan stok kosong/habis */
    .stok-habis { 
      background-color: var(--row-empty-bg) !important; 
      color: var(--badge-empty-text) !important; 
    }
    .stok-habis td {
      color: var(--badge-empty-text) !important;
    }

    /* Style khusus untuk baris judul/pemisah (seperti TITIP DI GETRA, MBG PINDAH GUDANG) */
    .baris-judul-kategori {
      background-color: var(--row-category-bg) !important;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--row-category-text) !important;
      border-top: 1px solid #dbeafe;
      border-bottom: 1px solid #dbeafe;
    }
  </style>
</head>
<body>

<div class="container-fluid max-width-lg">
  <div class="row mb-4 align-items-center">
    <div class="col-md-6">
      <h2 class="header-title mb-1">📦 Stok Barang Realtime PT. MBP</h2>
      <p class="text-muted mb-0" style="font-size: 0.9rem;">Data Realtime dari Google Sheets</p>
    </div>
    <div class="col-md-6 text-md-end mt-3 mt-md-0">
      <input type="text" id="searchInput" class="form-control search-input" placeholder="🔍 Cari nama / merk / tipe barang..." onkeyup="filterBarang()">
    </div>
  </div>

  <div class="table-container table-responsive">
    <table class="table table-hover align-middle" id="stokTable">
      <thead>
        <tr>
          <th width="15">NO</th>
          <th width="280">BARANG</th>
          <th class="text-center" width="150">STOK AWAL</th>
          <th class="text-center" width="150">STOK KELUAR</th>
          <th class="text-center" width="200">SALDO / SISA STOK</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="5" class="text-center py-4 text-muted">Memuat data stok...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // GANTI URL DI BAWAH INI DENGAN URL APPS SCRIPT ANDA
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyubZMKxaNS89ROsbayuHtDugIWjAf2nGESShZWA5N8wUwMnZgrmKSwk-6-xDnEO2b9/exec';

  async function loadStokData() {
    try {
      const response = await fetch(SCRIPT_URL);
      const data = await response.json();
      
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      if (data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Tidak ada data stok.</td></tr>';
        return;
      }

      data.forEach(item => {
        const row = document.createElement('tr');
        
        // Deteksi apakah baris ini adalah Judul Kategori (misal: "TITIP DI GETRA")
        const isJudulKategori = (!item.no || item.no === "") && 
                                (!item.stokAwal || item.stokAwal === "" || item.stokAwal === 0) && 
                                (!item.stokKeluar || item.stokKeluar === "" || item.stokKeluar === 0);

        if (isJudulKategori) {
          // Tampilan khusus untuk baris judul tabel / sub-judul
          row.classList.add('baris-judul-kategori');
          row.innerHTML = `
            <td></td>
            <td colspan="4"><strong>${item.barang || ''}</strong></td>
          `;
        } else {
          // Tampilan untuk baris data barang biasa
          const saldoNum = Number(item.saldo);
          const isKosong = !isNaN(saldoNum) && saldoNum <= 0;
          
          let badgeClass = 'badge-soft-primary';
          
          if (isKosong) {
            row.classList.add('stok-habis');
            badgeClass = 'badge-soft-danger';
          }

          row.innerHTML = `
            <td>${item.no || ''}</td>
            <td><strong>${item.barang || ''}</strong></td>
            <td class="text-center">${item.stokAwal !== "" && item.stokAwal !== undefined ? item.stokAwal : '-'}</td>
            <td class="text-center">${item.stokKeluar !== "" && item.stokKeluar !== undefined ? item.stokKeluar : '-'}</td>
            <td class="text-center">
              <span class="badge ${badgeClass} fs-6">${item.saldo !== undefined ? item.saldo : 0}</span>
            </td>
          `;
        }

        tableBody.appendChild(row);
      });
    } catch (error) {
      console.error('Gagal mengambil data:', error);
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Gagal memuat data dari Spreadsheet.</td></tr>';
    }
  }

  // Filter Pencarian
  function filterBarang() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    const rows = document.querySelectorAll('#tableBody tr');
    
    rows.forEach(row => {
      const namaBarang = row.cells[1] ? row.cells[1].textContent.toLowerCase() : '';
      if (namaBarang.includes(input)) {
        row.style.display = '';
      } else {
        row.style.display = 'none';
      }
    });
  }

  // Load pertama kali & set interval 10 detik
  loadStokData();
  setInterval(loadStokData, 10000);
</script>

</body>
</html>
